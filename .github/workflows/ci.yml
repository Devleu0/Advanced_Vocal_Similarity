# CI/CD Pipeline for the Project

name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly to catch any dependency-related issues
    - cron: '0 0 * * 1'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test against multiple Python versions for broader compatibility
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        # Create a new cache if requirements files change
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install PyTorch (CPU version for CI)
      # Install the appropriate CPU version of PyTorch first to ensure compatibility in the CI environment.
      run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

    - name: Install project dependencies
      run: |
        pip install -r requirements.txt --no-deps
        pip install -r requirements-web.txt
        pip install -r requirements-dev.txt

    - name: Lint with Ruff
      # Check code for style and quality issues
      run: ruff check .

    - name: Run tests with pytest
      run: python -m pytest tests/

  security-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
